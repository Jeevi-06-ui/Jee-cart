
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jee Cart | When Requirement Matches Trend</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f2f2f2;
      color: #333;
    }
    header {
      background-color: #141414;
      padding: 20px;
      text-align: center;
      color: #fff;
    }
    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }
    header p {
      margin-top: 5px;
      font-size: 1rem;
      color: #ccc;
    }
    .products {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
    }
    .product {
      background: #fff;
      margin: 10px;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 220px;
      text-align: center;
    }
    .product img {
      width: 100%;
      height: 150px;
      object-fit: contain;
    }
    .product h3 {
      margin: 10px 0 5px;
    }
    .product p {
      margin: 5px 0;
    }
    .payment {
      text-align: center;
      padding: 30px 10px;
      background-color: #fff;
    }
    .payment h2 {
      margin-bottom: 10px;
    }
    .qr-code img {
      width: 200px;
      margin-top: 10px;
    }
    footer {
      background: #141414;
      color: #ccc;
      text-align: center;
      padding: 15px 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Jee Cart</h1>
    <p>When Requirement Matches Trend</p>
  </header>

  <section class="products">
    <div class="product">
      <img src="https://m.media-amazon.com/images/I/61vZILb4ZCL._SL1500_.jpg" alt="Power Bank" />
      <h3>Power Bank</h3>
      <p>Compatible with Vivo, Samsung, Redmi</p>
    </div>
    <div class="product">
      <img src="https://m.media-amazon.com/images/I/61-5zsvsH7L._SL1500_.jpg" alt="Bluetooth Headset" />
      <h3>Bluetooth Headsets</h3>
      <p>From boAt, pTron, Portronics</p>
    </div>
    <div class="product">
      <img src="https://m.media-amazon.com/images/I/61fRzR2VqzL._SL1500_.jpg" alt="Fast Charger" />
      <h3>Chargers</h3>
      <p>Fast & Safe Charging for All Brands</p>
    </div>
  </section>

  <section class="payment">
    <h2>Pay via UPI</h2>
    <p>Scan the QR or send to: <strong>jeevithp18@axl</strong></p>
    <div class="qr-code">
      <img src="https://i.imgur.com/CK4LDPG.png" alt="UPI QR Code" />
    </div>
  </section>

  <footer>
    © 2025 Jee Cart | Powered by Jeevith P
  </footer>
</body>
</html>
